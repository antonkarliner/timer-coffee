allprojects {
    repositories {
        google()
        mavenCentral()
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:-options" // Suppress certain lint warnings
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
// Floor every Android library module at compileSdk 36. Some plugins still
// declare a compileSdk below what their AndroidX dependencies require, which
// fails :<plugin>:checkDebugAarMetadata. Plan 070 removed the hook and
// flutter_keyboard_visibility (31) failed first; image_cropper (33) is also
// below 34, and a dozen more sit at 34-35. Remove once none fall below the
// AndroidX floor (plan 069).
subprojects { project ->
    project.afterEvaluate {
        if (project.plugins.hasPlugin('com.android.library')) {
            def currentCompileSdk = project.android.compileSdk
            def currentCompileSdkVersion = currentCompileSdk instanceof Number
                ? currentCompileSdk.intValue()
                : currentCompileSdk.toString().replaceFirst(/^android-/, '').toInteger()
            if (currentCompileSdkVersion < 36) {
                project.android.compileSdk = 36
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
